[project]
name = "gn-dashboard"
version = "0.2.0"
description = "Dashboard Streamlit de relatórios sobre a base de dados Sage X3 da Garrafeira Nacional."
authors = [{ name = "José Roberto Ferreira" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.0",
    "pwdlib[argon2]>=0.2.1",
    "pyodbc>=5.2.0",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.41",
    "streamlit>=1.45.1",
]

[project.scripts]
gn-dashboard = "gn_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gn_dashboard"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "sqlacodegen>=3.0.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR6301", "PLC2701"]

[tool.ruff.format]
preview = true
quote-style = 'single'
