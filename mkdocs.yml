site_name: GN Dashboard
site_description: Dashboard Streamlit de relatórios sobre a base de dados Sage X3 da Garrafeira Nacional.
site_author: José Roberto Ferreira
copyright: Garrafeira Nacional
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt
  logo: assets/logo.png
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Guia:
      - Instalação: guia/instalacao.md
      - Configuração: guia/configuracao.md
      - Executar a aplicação: guia/executar.md
  - Arquitetura:
      - Visão geral: arquitetura/index.md
      - Estrutura de pastas: arquitetura/estrutura.md
      - Autenticação: arquitetura/autenticacao.md
      - Relatórios: arquitetura/relatorios.md
  - Desenvolvimento:
      - Fluxo de trabalho: desenvolvimento/index.md
      - Adicionar um relatório: desenvolvimento/novo-relatorio.md
      - Documentação: desenvolvimento/documentacao.md
  - Referência da API:
      - referencia/index.md
      - Core: referencia/core.md
      - Base de dados: referencia/database.md
      - Modelos: referencia/models.md
      - Repositórios: referencia/repositories.md
      - Serviços: referencia/services.md
      - UI: referencia/ui.md
      - Utilitários: referencia/utils.md
  - Migração 0.1 → 0.2: migracao.md
